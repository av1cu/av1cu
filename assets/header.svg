<svg xmlns="http://www.w3.org/2000/svg" width="880" height="196" viewBox="0 0 880 196" role="img" aria-labelledby="t d">
  <title id="t">Yerkezhan — Full-Stack Developer, Data Science Student</title>
  <desc id="d">Header card: name, roles, location Almaty Kazakhstan, and current status.</desc>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .name { font-size: 40px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.6px; }
    .role { font-size: 15px; fill: #adbac7; letter-spacing: 0.2px; }
    .meta { font-size: 12px; fill: #6e7681; letter-spacing: 0.6px; }
    .stat { font-size: 12.5px; fill: #8b949e; }
    .accent { fill: #58a6ff; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: p 2.6s ease-in-out infinite; }
      .caret { animation: c 1.15s steps(1) infinite; }
    }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes c { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="195" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="4" height="195" rx="2" fill="#58a6ff" opacity="0.75"/>

  <!-- top rail -->
  <text x="34" y="34" class="mono meta">~/yerkezhan</text>
  <text x="846" y="34" class="mono meta" text-anchor="end">ALMATY, KAZAKHSTAN &#183; UTC+5</text>
  <line x1="34" y1="48" x2="846" y2="48" stroke="#21262d"/>

  <!-- identity -->
  <text x="34" y="96" class="sans name">Yerkezhan</text>
  <text x="34" y="124" class="sans role">Full-Stack Developer<tspan class="accent" dx="8" dy="0">&#183;</tspan><tspan dx="8">Data Science Student</tspan><tspan class="accent" dx="8">&#183;</tspan><tspan dx="8">AI &#38; Backend</tspan></text>

  <!-- status -->
  <line x1="34" y1="146" x2="846" y2="146" stroke="#21262d"/>
  <circle cx="40" cy="171" r="4" fill="#3fb950" class="pulse"/>
  <text x="56" y="176" class="mono stat">studying Data Science &#183; building full-stack and AI projects<tspan class="accent caret" dx="6">&#9608;</tspan></text>
</svg>
