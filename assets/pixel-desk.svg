<svg xmlns="http://www.w3.org/2000/svg" width="128" height="44" viewBox="0 0 128 44" shape-rendering="crispEdges" role="img" aria-labelledby="t d">
  <title id="t">Pixel-art workstation</title>
  <desc id="d">Pixel scene: a monitor with code appearing line by line, a steaming mug, and a server rack with blinking status lights.</desc>

  <style>
    .l  { opacity: 0 }
    .c  { fill: #58a6ff }
    .g  { fill: #3fb950 }
    .m  { fill: #6e7681 }
    .fr { fill: #30363d }
    @media (prefers-reduced-motion: no-preference) {
      .l    { animation: type 6s steps(1) infinite }
      .l2   { animation-delay: .5s }
      .l3   { animation-delay: 1s }
      .l4   { animation-delay: 1.5s }
      .l5   { animation-delay: 2s }
      .cur  { animation: blink 1s steps(1) infinite }
      .s    { animation: steam 3s linear infinite }
      .s2   { animation-delay: 1s }
      .s3   { animation-delay: 2s }
      .led  { animation: blink 1.4s steps(1) infinite }
      .led2 { animation-duration: 2.2s }
      .led3 { animation-duration: .9s }
      .led4 { animation-duration: 3.1s }
    }
    @media (prefers-reduced-motion: reduce) { .l { opacity: 1 } }
    @keyframes type  { 0%,4% { opacity: 0 } 8%,88% { opacity: 1 } 92%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: .15 } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(0) } 25% { opacity: .55 } 100% { opacity: 0; transform: translateY(-6px) } }
  </style>

  <rect width="128" height="44" fill="#0d1117"/>

  <!-- desk -->
  <rect x="2" y="38" width="124" height="2" fill="#21262d"/>

  <!-- monitor -->
  <rect x="20" y="34" width="6" height="4" class="fr"/>
  <rect x="15" y="38" width="16" height="2" class="fr"/>
  <rect x="6" y="6" width="34" height="28" class="fr"/>
  <rect x="8" y="8" width="30" height="24" fill="#0b1017"/>

  <!-- code lines -->
  <g class="l">      <rect x="10" y="11" width="8"  height="2" class="c"/><rect x="20" y="11" width="12" height="2" class="m"/></g>
  <g class="l l2">   <rect x="12" y="15" width="6"  height="2" class="g"/><rect x="20" y="15" width="10" height="2" class="m"/></g>
  <g class="l l3">   <rect x="12" y="19" width="14" height="2" class="m"/></g>
  <g class="l l4">   <rect x="10" y="23" width="10" height="2" class="c"/><rect x="22" y="23" width="6"  height="2" class="m"/></g>
  <g class="l l5">   <rect x="12" y="27" width="8"  height="2" class="m"/><rect x="22" y="27" width="3" height="2" class="c cur"/></g>

  <!-- mug -->
  <rect x="52" y="29" width="10" height="9" fill="#484f58"/>
  <rect x="53" y="30" width="8"  height="1" fill="#0b1017"/>
  <rect x="62" y="31" width="2"  height="2" fill="#484f58"/>
  <rect x="63" y="33" width="1"  height="2" fill="#484f58"/>
  <rect x="62" y="35" width="2"  height="1" fill="#484f58"/>
  <rect x="54" y="27" width="1" height="2" class="m s"/>
  <rect x="57" y="27" width="1" height="2" class="m s s2"/>
  <rect x="59" y="27" width="1" height="2" class="m s s3"/>

  <!-- server rack -->
  <rect x="84" y="8" width="30" height="30" class="fr"/>
  <rect x="86" y="10" width="26" height="26" fill="#0b1017"/>
  <g fill="#21262d">
    <rect x="88" y="12" width="22" height="4"/>
    <rect x="88" y="18" width="22" height="4"/>
    <rect x="88" y="24" width="22" height="4"/>
    <rect x="88" y="30" width="22" height="4"/>
  </g>
  <g fill="#484f58">
    <rect x="90" y="13" width="8" height="2"/>
    <rect x="90" y="19" width="6" height="2"/>
    <rect x="90" y="25" width="9" height="2"/>
    <rect x="90" y="31" width="7" height="2"/>
  </g>
  <rect x="107" y="13" width="2" height="2" class="g led"/>
  <rect x="107" y="19" width="2" height="2" class="c led led2"/>
  <rect x="107" y="25" width="2" height="2" class="g led led3"/>
  <rect x="107" y="31" width="2" height="2" class="g led led4"/>

  <!-- cable monitor -> rack -->
  <rect x="40" y="36" width="44" height="1" fill="#21262d"/>
</svg>
